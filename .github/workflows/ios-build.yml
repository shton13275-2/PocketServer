name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project PocketServer.xcodeproj \
            -scheme PocketServer \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PocketServerDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/PocketServerDerivedData/Build/Products/Release-iphoneos/PocketServer.app"
          test -d "$APP_PATH"
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          zip -r ../PocketServer-unsigned.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketServer-unsigned-IPA
          path: PocketServer-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
