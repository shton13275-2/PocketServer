name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project PocketServer.xcodeproj \
            -scheme PocketServer \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          APP_PATH=$(find . -type d -name PocketServer.app -path '*/Build/Products/*' | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" PocketServer-Simulator-App.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketServer-iOS-Simulator
          path: PocketServer-Simulator-App.zip
          if-no-files-found: error
