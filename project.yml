name: PocketServer
options:
  bundleIdPrefix: jp.shton13275
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
targets:
  PocketServer:
    type: application
    platform: iOS
    sources:
      - PocketServer/ContentView.swift
      - PocketServer/PocketServerApp.swift
      - PocketServer/ServerController.swift
      - PocketServer/WebDownloadBrowser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shton13275.PocketServer
        PRODUCT_NAME: PocketServer
        INFOPLIST_KEY_CFBundleDisplayName: PocketServer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "PocketServerは同じWi-Fi上のPCやiPadとファイルを送受信するため、ローカルネットワークへのアクセスを使用します。"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: PocketServer/PocketServer.entitlements
    dependencies:
      - target: PocketServerShareExtension
        embed: true
  PocketServerShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PocketServer/ShareExtension.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shton13275.PocketServer.ShareExtension
        PRODUCT_NAME: PocketServerShareExtension
        INFOPLIST_FILE: PocketServer/ShareExtension-Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: PocketServer/ShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
